name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npx tsc --noEmit
      
    - name: Run local security tests
      run: npx tsx scripts/test-security.ts

    - name: Run template contract tests
      run: npx tsx scripts/test-templates.ts

    - name: Build Next.js app
      env:
        NEXTAUTH_SECRET: 'ci-build-secret-32-chars-minimum-12345'
        NEXTAUTH_URL: 'http://localhost:3000'
      run: npm run build
